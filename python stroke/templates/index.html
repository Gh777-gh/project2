<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Image Analysis System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #12486D;
            background-color: white !important;
        }
        header {
            /* background: linear-gradient(#999, rgba(18, 72, 109, 0.7)), url('https://i.pinimg.com/736x/e4/fb/9c/e4fb9c70e84e56a0503b6a871dd5be9b.jpg') no-repeat center center/cover; */
            color: black;
            text-align: center;
            padding: 150px 20px;
        }
        header h1 {
            font-size: 3.5em;
            margin: 0;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
        }
        header p {
            font-size: 1.5em;
            margin-top: 10px;
        }

        .services img, .about img, .upload-section img {
            border-radius: 10px;
        }
        footer {
            /* background-color: #12486D; */
            color: white;
        }
        
        /* New Service Card Styles */
        .service-card {
            position: relative;
            height: 300px;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
        }
        
        .service-front,
        .service-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            transition: transform 0.6s ease;
        }
        
        .service-front {
            background-color: #659FC6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .service-front img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
        
        .service-front h5 {
            margin-top: 15px;
            color: white;
        }
        
        .service-back {
            background-color: #93D0D6;
            padding: 20px;
            transform: rotateY(180deg);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        
        .service-card:hover .service-front {
            transform: rotateY(180deg);
        }
        
        .service-card:hover .service-back {
            transform: rotateY(0deg);
        }
        
        .btn-success {
            background-color: #12486D !important;
            border-color: #12486D !important;
        }
        
        .btn-success:hover {
            background-color: #659FC6 !important;
            border-color: #659FC6 !important;
        }
        
    </style>
</head>
<body>

<section id="upload" class="py-5 bg-light">
    <div class="container text-center">
        <h2 class="mb-4">Upload Images</h2>
        <form id="uploadForm" method="post" enctype="multipart/form-data" action="/analyze">
            <div class="mb-3">
                <input type="file" class="form-control" id="imageUpload" name="image" accept="image/*" required>
            </div>
            <button type="submit" class="btn btn-success">Analyze Image</button>
        </form>

    </div>
</section>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
