<!DOCTYPE html>
<html lang="ar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis result</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            direction: rtl;
        }

        .result-container {
            background-color: #ffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .result {
            font-size: 24px;
            margin: 10px 0;
        }

        .stroke {
            color: #e74c3c;
            font-weight: bold;
        }

        .no-stroke {
            color: #2ecc71;
            font-weight: bold;
        }

        .confidence {
            font-size: 20px;
            color: #555;
        }

        .highlight {
            background-color: #f1c40f;
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
        }
    </style>
</head>

<body>
    <div class="result-container">
        <h1>Image Analysis Result</h1>
        {% if has_stroke %}
        <p class="result stroke">Stroke detected</p>
        {% else %}
        <p class="result no-stroke">No stroke</p>
        {% endif %}
        <p class="confidence">Confidence percentage: <span class="highlight">{{ "%.2f"|format(confidence) }}%</span></p>
<br>
<hr>
<a href="/">Return Back</a>
    </div>
</body>

</html>
